    desc: '<code>_LibSer_SEPControl_Deserialize</code> copies <code>declared_length</code> bytes without bounding it against remaining buffer size. Feed 0x800 → read ~0x7E8 bytes of adjacent kernel heap into userspace. ACM handle captured via DYLD_INTERPOSE on Security.framework\'s in-process IOKit call.',

      '<strong>Chain:</strong> arm interpose → <code>SecKeyCreateSignature</code> → in-process IOKit call fires → capture <code>(conn, handle[16])</code> → replay with <code>declared_length=0x800</code> across 163 AKS selectors → scan output for <code>0xfffffff0xxxxxxxx</code> kptrs → compute KASLR slide.',

  },

    component: 'XNU VFS — tmpfs VNOP',
    subtitle: 'Fixed PAC Diversifier',
    type: 'PAC Bypass · PC Control',
    affected: 'iOS / iPadOS 26.6 (23G71)',
    fixed: 'iOS / iPadOS 26.6.1 (23G83)',
    credits: 'Bhaswanth Chigurupati, Billy Jheng Bing Jhong, Pan Zhenpeng (@Peterpan0927) of STAR Labs SG Pte. Ltd.',
    desc: '<code>default_setxattr_doubleagent</code> signs the xattr handler pointer with a fixed compile-time diversifier <code>#0x307a</code>. With the known diversifier, any PACIA-forged pointer authenticates — giving PC control via any <code>setxattr()</code> call on tmpfs from a kernel write primitive.',

/* ── Router ────────────────────────────────────────────────────── */
function navigate(path) {
  const p = path || '/';
  let html;
  if (p === '/' || p === '') html = renderHome();
  else if (p === '/about') html = renderAbout();
  else if (p === '/research') html = renderResearch();
  else if (p === '/cves') html = renderCVEList();
  else if (p.startsWith('/cves/')) html = renderCVEDetail(p.slice(6));
  else if (p === '/projects') html = renderProjects();
  else if (p === '/contact') html = renderContact();
  else html = renderHome();

  const view = document.getElementById('view');
  view.style.opacity = '0';
  view.style.transition = 'opacity 0.12s';
  setTimeout(() => {
    view.innerHTML = html;
    view.style.opacity = '1';
    window.scrollTo(0, 0);
  }, 80);

  document.querySelectorAll('#nav-links a').forEach(a => {
    const href = a.getAttribute('href');
    const active = href === p || (href !== '/' && p.startsWith(href));
    a.classList.toggle('active', active);
  });
}

function go(path) {
  history.pushState(null, '', path);
  navigate(path);
}

/* Intercept all [data-spa] clicks */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-spa]');
  if (!a) return;
  e.preventDefault();
  go(a.getAttribute('href'));
});

window.addEventListener('popstate', () => navigate(location.pathname));

window.addEventListener('DOMContentLoaded', () => {
  /* Restore path saved by 404.html */
  const redirect = sessionStorage.getItem('spa_redirect');
  if (redirect && redirect !== '/') {
    sessionStorage.removeItem('spa_redirect');
    history.replaceState(null, '', redirect);
    navigate(redirect);
  } else {
    navigate(location.pathname);
  }
});
</script>
